<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destek Paneli</title>
<link rel="stylesheet" href="style.css">

<style>
.conversation{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  margin:18px 0;
}

.conversation-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.conversation-id{
  font-size:11px;
  color:#777;
  word-break:break-all;
}

.message{
  padding:10px 12px;
  border-radius:12px;
  margin:8px 0;
}

.message.user{
  background:#f1f5f9;
}

.message.support{
  background:#eef2ff;
}

.message small{
  display:block;
  color:#777;
  margin-bottom:5px;
}

.reply-area{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.reply-text{
  flex:1;
  min-height:70px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:10px;
  resize:vertical;
  font:inherit;
  box-sizing:border-box;
}

.send-reply{
  padding:10px 18px;
  border:0;
  border-radius:10px;
  background:#635bff;
  color:white;
  font-weight:bold;
}

@media(max-width:600px){
  .reply-area{
    flex-direction:column;
  }

  .send-reply{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <b>item<span>destek</span> — Destek Paneli</b>
</header>

<main>

<h1>Gelen Destek Mesajları</h1>

<p>
  Her kullanıcıyla ayrı bir sohbet.
  İstediğin kadar mesaj gönder.
</p>

<div id="list">
  Yükleniyor...
</div>

</main>

<script src="config.js"></script>

<script>

const list = document.querySelector("#list");

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


async function load(){

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/support_messages?select=*&order=created_at.asc",
      {
        headers:{
          apikey:SUPABASE_ANON_KEY,
          Authorization:"Bearer " + SUPABASE_ANON_KEY
        }
      }
    );

    if(!response.ok){

      const error = await response.text();

      console.error(error);

      list.innerHTML =
        "<div class='notice'>Supabase bağlantı hatası.</div>";

      return;
    }


    const data = await response.json();


    if(!data.length){

      list.innerHTML =
        "<p>Henüz mesaj yok.</p>";

      return;
    }


    /* MESAJLARI SESSION'A GÖRE GRUPLA */

    const conversations = new Map();


    for(const message of data){

      if(!conversations.has(message.session_id)){

        conversations.set(
          message.session_id,
          []
        );

      }

      conversations
        .get(message.session_id)
        .push(message);

    }


    /* EN SON KONUŞMA ÜSTTE */

    const groups =
      [...conversations.entries()].reverse();


    list.innerHTML =
      groups.map(([sessionId,messages]) => {

        return `

        <section class="conversation">

          <div class="conversation-head">

            <b>Destek Konuşması</b>

            <span class="conversation-id">
              ${escapeHtml(sessionId)}
            </span>

          </div>


          <div class="conversation-messages">

            ${messages.map(x => `

              <div class="message ${
                x.sender === "support"
                  ? "support"
                  : "user"
              }">

                <small>

                  ${
                    x.sender === "support"
                      ? "Destek"
                      : "Kullanıcı"
                  }

                  ·

                  ${escapeHtml(x.created_at || "")}

                </small>


                <div>
                  ${escapeHtml(x.message)}
                </div>

              </div>

            `).join("")}

          </div>


          <!-- HER KONUŞMADA AYRI CEVAP KUTUSU -->

          <div class="reply-area">

            <textarea
              class="reply-text"
              data-session="${escapeHtml(sessionId)}"
              placeholder="Cevabını yaz..."
            ></textarea>


            <button
              class="send-reply"
              data-session="${escapeHtml(sessionId)}"
            >
              Gönder
            </button>

          </div>

        </section>

        `;

      }).join("");


  }catch(e){

    console.error(e);

    list.innerHTML =
      "<div class='notice'>Bağlantı hatası: " +
      escapeHtml(e.message) +
      "</div>";

  }

}


/* CEVAP GÖNDER */

async function sendReply(sessionId){

  const textarea =
    document.querySelector(
      '.reply-text[data-session="' +
      CSS.escape(sessionId) +
      '"]'
    );


  if(!textarea) return;


  const message =
    textarea.value.trim();


  if(!message) return;


  const button =
    document.querySelector(
      '.send-reply[data-session="' +
      CSS.escape(sessionId) +
      '"]'
    );


  if(button){

    button.disabled = true;

    button.textContent =
      "Gönderiliyor...";

  }


  try{

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/support_messages",

      {

        method:"POST",

        headers:{

          apikey:SUPABASE_ANON_KEY,

          Authorization:
            "Bearer " +
            SUPABASE_ANON_KEY,

          "Content-Type":
            "application/json",

          Prefer:
            "return=minimal"

        },

        body:JSON.stringify({

          session_id:sessionId,

          sender:"support",

          message:message

        })

      }

    );


    if(!response.ok){

      const error =
        await response.text();

      console.error(error);

      alert(
        "Cevap gönderilemedi."
      );

      if(button){

        button.disabled = false;

        button.textContent =
          "Gönder";

      }

      return;

    }


    textarea.value = "";


    await load();


  }catch(e){

    console.error(e);

    alert(
      "Bağlantı hatası: " +
      e.message
    );


    if(button){

      button.disabled = false;

      button.textContent =
        "Gönder";

    }

  }

}


/* GÖNDER BUTONLARI */

list.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        ".send-reply"
      );


    if(!button) return;


    sendReply(
      button.dataset.session
    );

  }
);


/* HER 4 SANİYEDE YENİLE */

load();

setInterval(
  load,
  4000
);

</script>

</body>
</html>
