<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destek Paneli</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>item<span>destek</span> — Destek Paneli</b></header><main><h1>Gelen Destek Mesajları</h1><p>Bu sayfa sadece destekçi/admin kullanımına ayrılmalıdır.</p><div id="list"></div></main>
<script src="config.js"></script><script>
const list=document.querySelector("#list");
async function load(){if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY){list.innerHTML="<div class='notice'>config.js içine Supabase bilgilerini eklemeden gerçek mesajlar görünmez.</div>";return}
const r=await fetch(SUPABASE_URL+"/rest/v1/support_messages?select=*&order=created_at.desc",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}});const data=await r.json();list.innerHTML=data.map(x=>`<div class="ticket"><small>${x.created_at||""}</small><b>${x.sender}</b><p>${String(x.message).replaceAll("<","&lt;")}</p>${x.sender==="user"?`<button onclick="reply('${x.session_id}')">Cevapla</button>`:""}</div>`).join("")||"<p>Henüz mesaj yok.</p>"}
function reply(id){const t=prompt("Cevabın:");if(!t)return;fetch(SUPABASE_URL+"/rest/v1/support_messages",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({session_id:id,sender:"support",message:t})}).then(load)}
load();setInterval(load,4000);
</script></body></html>
