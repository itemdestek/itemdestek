<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destek Paneli</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>item<span>destek</span> — Destek Paneli</b>
</header>

<main>
  <h1>Gelen Destek Mesajları</h1>
  <p>Gelen mesajları buradan görebilir ve cevaplayabilirsin.</p>

  <div id="list">
    Yükleniyor...
  </div>
</main>

<script src="config.js"></script>

<script>
const list = document.querySelector("#list");

async function load() {
  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/support_messages?select=*&order=created_at.desc",
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY
        }
      }
    );

    if (!response.ok) {
      const error = await response.text();
      console.error(error);
      list.innerHTML = "<div class='notice'>Supabase bağlantı hatası.</div>";
      return;
    }

    const data = await response.json();

    if (!data.length) {
      list.innerHTML = "<p>Henüz mesaj yok.</p>";
      return;
    }

    list.innerHTML = data.map(x => `
      <div class="ticket">
        <small>${x.created_at || ""}</small>
        <b>${x.sender}</b>
        <p>${String(x.message).replaceAll("<","&lt;")}</p>
        ${
          x.sender === "user"
          ? `<button onclick="reply('${x.session_id}')">Cevapla</button>`
          : ""
        }
      </div>
    `).join("");

  } catch (e) {
    console.error(e);
    list.innerHTML = "<div class='notice'>Bağlantı hatası: " + e.message + "</div>";
  }
}

async function reply(id) {
  const old = document.querySelector("#replyBox");
  if (old) old.remove();

  const box = document.createElement("div");
  box.id = "replyBox";
  box.innerHTML = `
    <div style="
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      width:90%;
      max-width:500px;
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 5px 25px rgba(0,0,0,.25);
      z-index:9999;
    ">
      <textarea id="replyText"
        placeholder="Cevabını yaz..."
        style="width:100%;height:100px;padding:10px;box-sizing:border-box;"
      ></textarea>

      <button id="sendReply" style="margin-top:10px;padding:10px 18px;">
        Gönder
      </button>

      <button id="cancelReply" style="margin-top:10px;padding:10px 18px;">
        İptal
      </button>
    </div>
  `;

  document.body.appendChild(box);

  document.querySelector("#replyText").focus();

  document.querySelector("#cancelReply").onclick = () => {
    box.remove();
  };

  document.querySelector("#sendReply").onclick = async () => {
    const message = document.querySelector("#replyText").value.trim();

    if (!message) return;

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/support_messages",
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          session_id: id,
          sender: "support",
          message: message
        })
      }
    );

    if (!response.ok) {
      alert("Cevap gönderilemedi.");
      return;
    }

    box.remove();
    load();
  };
}

load();
setInterval(load, 4000);
</script>

</body>
</html>
